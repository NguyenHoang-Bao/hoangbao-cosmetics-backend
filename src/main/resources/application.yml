spring:
  application:
    name: hoangbaocosmetics_backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hoangbao_cosmetics_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:hbao4142@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Cấu hình máy chủ web và nén gzip cho HTTP Response
server:
  forward-headers-strategy: framework # Tự động nhận diện IP thật và giao thức HTTPS từ Render/Railway/Nginx Reverse Proxy
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

# Cấu hình danh sách tên miền CORS và URL hệ thống
app:
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Cấu hình JWT cho ứng dụng
jwt:
  # Secret key tối thiểu 256-bit (chuỗi Base64)
  secret: ${JWT_SECRET}
  # Thời hạn token: 86400000 ms = 24 giờ = 1 ngày
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Cấu hình thanh toán VietQR & SePay Webhook
payment:
  vietqr:
    bank-id: "${VIETQR_BANK_ID:MBBank}" # Mã ngân hàng (MBBank, VCB, ACB, TPBank, TCB, VPB,...)
    account-number: "${VIETQR_ACCOUNT_NUMBER:14580886868}" # Số tài khoản ngân hàng nhận tiền
    account-name: "${VIETQR_ACCOUNT_NAME:NGUYEN HOANG BAO}" # Tên chủ tài khoản
    template: "${VIETQR_TEMPLATE:compact2}" # Template hiển thị mã QR: compact, compact2, qr_only
  sepay:
    api-key: ${SEPAY_API_KEY} # API Key do SePay cấp để xác thực Webhook (Fail-closed)

# Cấu hình OAuth Google
google:
  client-id: "${GOOGLE_CLIENT_ID:237683305659-mv2f4c61lghtdahblnffl6f6tbn6p66m.apps.googleusercontent.com}"

# Cấu hình Spring Boot Actuator (Healthcheck cho Docker/Render/Railway)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
name: Backend CD (Build, Push & Deploy AWS)

# Kích hoạt khi quy trình Backend CI chạy thành công trên nhánh main
on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [main]
    types:
      - completed

# Hủy lượt chạy cũ nếu có commit mới liên tục vào main
concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Build Docker Image và đẩy lên kho Docker Hub (Chỉ chạy khi CI thành công)
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1. Kéo mã nguồn về máy ảo theo commit của workflow CI vừa hoàn tất
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 2. Cài đặt Java 17 và nạp bộ nhớ đệm Maven
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Cấp quyền thực thi cho Maven Wrapper
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # 4. Đóng gói ra file JAR thành phẩm
      - name: Package JAR
        run: ./mvnw clean package -DskipTests

      # 5. Cài đặt công cụ Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Đăng nhập vào Docker Hub bằng GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build Image từ Dockerfile và đẩy lên kho Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hoangbaocosmetics-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hoangbaocosmetics-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: SSH vào máy chủ AWS EC2 để kéo image mới và restart container
  deploy-to-aws:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy Container on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu
            docker compose pull backend
            docker compose up -d --no-deps backend
            docker image prune -f

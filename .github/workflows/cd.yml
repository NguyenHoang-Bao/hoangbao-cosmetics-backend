name: Backend CD (Build & Push Docker)

# Kích hoạt khi code được push hoặc merge vào nhánh main
on:
  push:
    branches:
      - main

# Hủy lượt chạy cũ nếu có commit mới liên tục vào main
concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Java 17 và nạp bộ nhớ đệm Maven
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Cấp quyền thực thi cho file Maven Wrapper trên Linux
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # 4. Đóng gói ra file JAR thành phẩm (bỏ qua test vì đã được CI kiểm tra trước khi merge)
      - name: Package JAR
        run: ./mvnw clean package -DskipTests

      # 5. Cài đặt công cụ Docker Buildx để tăng tốc đóng gói image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Đăng nhập vào Docker Hub bằng GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build Image từ Dockerfile và đẩy lên kho Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hoangbaocosmetics-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hoangbaocosmetics-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
